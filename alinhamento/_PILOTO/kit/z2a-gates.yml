# ZenithCode Lite — Gates determinísticos (piloto dogfood).
# Copie para .github/workflows/z2a-gates.yml no seu repositório.
#
# Fase BASELINE (semanas 1–2): mantenha `ATIVAR_GATES: "false"` → só coleta, sem travar.
# Fase TRATAMENTO (semanas 3–4): mude para `"true"` → os gates passam a QUEBRAR o build.
name: z2a-gates

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # >>> A CHAVE DA SÉRIE TEMPORAL INTERROMPIDA <<<
  # "false" durante o baseline (não trava), "true" no tratamento (trava).
  ATIVAR_GATES: "false"

jobs:
  build-e-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necessário para diff-cover e lead-time

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 1) Build + testes + ArchUnit + cobertura (JaCoCo).
      #    ArchUnit roda junto dos testes; se o domínio tocar infra, falha aqui.
      - name: Build, testes e cobertura
        run: mvn -B verify   # requer jacoco-maven-plugin no pom (gera jacoco.xml)

      # 2) Gate T.D.E. (Racional + teste tocado).
      - name: Gate T.D.E. (Racional)
        if: env.ATIVAR_GATES == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          chmod +x scripts/check-tde-header.sh
          ./scripts/check-tde-header.sh

      # 3) Gate de cobertura do DIFF (build quebra se linhas alteradas têm 0% de cobertura).
      - name: Gate de cobertura do diff
        if: env.ATIVAR_GATES == 'true'
        run: |
          python -m pip install --quiet diff-cover
          # ajuste o caminho do jacoco.xml conforme seu projeto:
          diff-cover target/site/jacoco/jacoco.xml \
            --compare-branch origin/${{ github.event.pull_request.base.ref || 'main' }} \
            --fail-under 1   # >0%: nenhuma linha nova pode entrar sem teste. Suba o número quando quiser.

      # 4) Firewall de dependências (scan de CVE). Opcional: descomente se usar OWASP.
      # - name: Firewall de dependências (OWASP)
      #   if: env.ATIVAR_GATES == 'true'
      #   run: mvn -B org.owasp:dependency-check-maven:check
